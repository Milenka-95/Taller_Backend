spring.application.name=modiesel
spring.datasource.url=jdbc:mysql://localhost:3306/taller
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Security configurations
# CORS allowed origins (comma-separated list)
cors.allowed.origins=http://localhost:3000,http://localhost:4200

# JWT Secret Key - Change this to a strong, random secret in production
# This key should be at least 256 bits (32 characters) for HS256 algorithm
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890

# Server configuration - hide version information
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# Disable unnecessary features
spring.jmx.enabled=false